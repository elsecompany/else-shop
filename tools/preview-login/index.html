<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#e9eefb">
  <title>else · private preview</title>
  <link rel="icon" type="image/png" href="/_login/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: #e9eefb; color: #2b2f3a;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    main { width: 100%; max-width: 340px; text-align: center; }
    img { height: 44px; margin-bottom: 36px; }
    h1 { font-family: "Inter", sans-serif; font-weight: 400; font-size: 30px; margin: 0 0 8px; }
    p { color: #6b7080; font-size: 15px; margin: 0 0 28px; line-height: 1.45; }
    input {
      width: 100%; font: inherit; font-size: 17px; padding: 15px 18px; border-radius: 999px;
      border: 1px solid rgba(43, 47, 58, 0.12); background: rgba(255, 255, 255, 0.75); color: inherit; outline: none;
    }
    input:focus { border-color: #a1c0ff; box-shadow: 0 0 0 3px rgba(161, 192, 255, 0.35); }
    button {
      width: 100%; margin-top: 12px; font: inherit; font-size: 17px; font-weight: 500; padding: 15px;
      border: 0; border-radius: 999px; background: #2b2f3a; color: #fff; cursor: pointer;
    }
    .error { color: #c4543a; font-size: 14px; min-height: 20px; margin-top: 14px; }
  </style>
</head>
<body>
  <main>
    <img src="/_login/logo-dark.png" alt="else">
    <h1>Private preview</h1>
    <p>This is where the else website is being made. Enter the password to see it.</p>
    <form id="form" autocomplete="on">
      <input type="text" name="username" value="else" autocomplete="username" hidden>
      <input id="password" type="password" name="password" placeholder="Password" autocomplete="current-password" required autofocus>
      <button type="submit">Enter</button>
    </form>
    <div class="error" id="error"></div>
  </main>
  <script>
    // The server only lets in browsers whose "else_preview" cookie holds the SHA-256 of the password.
    // The password itself is never stored here.
    var error = document.getElementById("error");
    // Back here a moment after trying: the password was not right
    var tried = Number(sessionStorage.getItem("elsePreviewTried") || 0);
    sessionStorage.removeItem("elsePreviewTried");
    if (tried && Date.now() - tried < 15000) {
      error.textContent = "That password isn't right. Try again.";
    }
    document.getElementById("form").addEventListener("submit", async function (e) {
      e.preventDefault();
      var password = document.getElementById("password").value;
      var digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(password));
      var hex = Array.from(new Uint8Array(digest)).map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
      document.cookie = "else_preview=" + hex + "; Max-Age=2592000; Path=/; Secure; SameSite=Lax";
      sessionStorage.setItem("elsePreviewTried", String(Date.now()));
      location.reload();
    });
  </script>
</body>
</html>
